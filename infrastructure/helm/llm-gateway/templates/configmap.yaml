apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-gateway.fullname" . }}-config
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
data:
  gateway.yaml: |
    # -----------------------------------------------------------------------
    # LLM Gateway — Runtime Configuration
    # Mounted at /app/config/gateway.yaml
    # -----------------------------------------------------------------------

    upstream:
      vllm_url: {{ .Values.gateway.vllmUrl | quote }}
      retriever_url: {{ .Values.gateway.retrieverUrl | quote }}
      timeout_seconds: {{ .Values.gateway.requestTimeoutSeconds }}

    auth:
      enabled: {{ .Values.gateway.auth.enabled }}

    rate_limiting:
      enabled: {{ .Values.gateway.rateLimiting.enabled }}
      default_requests_per_minute: {{ .Values.gateway.rateLimiting.defaultRequestsPerMinute }}
      default_tokens_per_minute: {{ .Values.gateway.rateLimiting.defaultTokensPerMinute }}
      tiers:
        {{- toYaml .Values.gateway.rateLimiting.tiers | nindent 8 }}

    limits:
      max_input_tokens: {{ .Values.gateway.maxInputTokens }}
      max_output_tokens: {{ .Values.gateway.maxOutputTokens }}

    logging:
      level: {{ .Values.gateway.logLevel | quote }}
      pii_redaction: {{ .Values.gateway.logPiiRedaction }}

    # Routing rules for canary / A-B testing
    routing:
      # Default: 100% traffic to primary vLLM
      primary_weight: 100
      canary_weight: 0
      canary_url: ""
      # Header-based routing override
      header_routing:
        enabled: false
        header_name: "X-Prompt-Version"
