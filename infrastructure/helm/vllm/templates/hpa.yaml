{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "vllm.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.metrics.gpuUtilization.enabled }}
    # GPU utilisation from DCGM exporter via Prometheus adapter
    - type: Pods
      pods:
        metric:
          name: DCGM_FI_DEV_GPU_UTIL
        target:
          type: AverageValue
          averageValue: "{{ .Values.autoscaling.metrics.gpuUtilization.targetValue }}"
    {{- end }}
    {{- if .Values.autoscaling.metrics.queueDepth.enabled }}
    # vLLM waiting queue depth — custom metric from /metrics endpoint
    - type: Pods
      pods:
        metric:
          name: vllm_num_requests_waiting
        target:
          type: AverageValue
          averageValue: "{{ .Values.autoscaling.metrics.queueDepth.targetValue }}"
    {{- end }}
  behavior:
    {{- with .Values.autoscaling.behavior.scaleUp }}
    scaleUp:
      stabilizationWindowSeconds: {{ .stabilizationWindowSeconds }}
      policies:
        {{- toYaml .policies | nindent 8 }}
    {{- end }}
    {{- with .Values.autoscaling.behavior.scaleDown }}
    scaleDown:
      stabilizationWindowSeconds: {{ .stabilizationWindowSeconds }}
      policies:
        {{- toYaml .policies | nindent 8 }}
    {{- end }}
{{- end }}
