###############################################################################
# vLLM Standalone Deployment (non-Helm)
#
# Deploys vLLM as a Kubernetes Deployment with GPU resources, model weight
# PVC mount, readiness probes, and environment-based configuration.
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: llmops
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llmops-platform
    app.kubernetes.io/version: "0.4.1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llmops-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Schedule on GPU-capable nodes only
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 120
      serviceAccountName: vllm-sa

      # GPU node tolerations
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "sku"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"

      nodeSelector:
        accelerator: nvidia-gpu

      # Spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["vllm"]
                topologyKey: kubernetes.io/hostname

      securityContext:
        fsGroup: 1000
        runAsNonRoot: true

      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.4.1
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

          args:
            - "--model"
            - "meta-llama/Llama-3-8B-Instruct"
            - "--tensor-parallel-size"
            - "2"
            - "--max-model-len"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.9"
            - "--max-num-seqs"
            - "256"
            - "--max-num-batched-tokens"
            - "32768"
            - "--dtype"
            - "auto"
            - "--enable-prefix-caching"
            - "--enable-chunked-prefill"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"

          env:
            # HuggingFace token for gated model access
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # Model cache directory
            - name: HF_HOME
              value: "/models/hf_cache"
            - name: TRANSFORMERS_CACHE
              value: "/models/hf_cache"
            # NCCL settings for multi-GPU
            - name: NCCL_DEBUG
              value: "WARN"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            # vLLM API key (optional — set in production)
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: api-key
                  optional: true

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Readiness probe — vLLM exposes /health
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Liveness probe — restart if unresponsive
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          # Startup probe — model loading can take several minutes
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # Up to 5 minutes

          resources:
            requests:
              cpu: "4"
              memory: "32Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "8"
              memory: "64Gi"
              nvidia.com/gpu: "2"

          volumeMounts:
            - name: model-weights
              mountPath: /models
            - name: shm
              mountPath: /dev/shm

      volumes:
        # Model weights from persistent volume
        - name: model-weights
          persistentVolumeClaim:
            claimName: vllm-model-weights
        # Shared memory for PyTorch DataLoader / NCCL
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "16Gi"

---
###############################################################################
# Service — expose vLLM inside the cluster
###############################################################################
apiVersion: v1
kind: Service
metadata:
  name: vllm-inference
  namespace: llmops
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: inference
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

---
###############################################################################
# PVC for model weights
###############################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-weights
  namespace: llmops
  labels:
    app.kubernetes.io/name: vllm
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-premium
  resources:
    requests:
      storage: 100Gi
